name: Business tests

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

concurrency:
  group: business-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pull-request:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUSINESS_TEST_E2E_SCRIPT: test:e2e:p0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run deterministic P0 business chain
        run: pnpm test:business
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-p0-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # FLAKE-P2-001: all engines repeat the sensitive suite twenty times.
      BUSINESS_TEST_E2E_SCRIPT: test:e2e:nightly
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run full repeated business chain
        run: pnpm test:business
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-nightly-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
